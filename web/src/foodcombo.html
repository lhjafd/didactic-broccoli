<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="foodcombo.css">
</head>
<body>
    <header>
    <h1>음식조합</h1>
</header>

<a href="foodmain.html" class="back-btn">
    ← 메인으로
</a>

<main>

    <div class="add-combo">
        <button onclick="toggleForm()">+ 조합 등록</button>
    </div>

<div id="comboModal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content">
        <div class="modal-header">
            <h2>🍴 새로운 음식 조합 등록</h2>
        </div>
        
        <div class="modal-body">
            <div id="foodInputList">
                <div class="input-group food-input-item">
                    <label>첫 번째 음식</label>
                    <div class="input-row">
                        <input type="text" placeholder="예) 포카칩">
                    </div>
                </div>
                <div class="input-group food-input-item">
                    <label>두 번째 음식</label>
                    <div class="input-row">
                        <input type="text" placeholder="예) 피크닉">
                        <button type="button" class="remove-food-btn" onclick="removeFoodField(this)">×</button>
                    </div>
                </div>
            </div>

            <button type="button" class="add-food-field-btn" onclick="addFoodField()">+ 음식 추가</button>

            <div class="input-group" style="margin-top: 20px;">
                <div class="label-row">
                    <label>조합 설명</label>
                    <span id="charCount" class="char-count">0 / 200</span>
                </div>
                <textarea id="comboDescription" maxlength="200" oninput="updateCharCount()" placeholder="조합에 대해 간단히 설명해주세요..."></textarea>
            </div>
        </div>

        <div class="modal-footer">
            <button class="submit-btn">조합 등록하기</button>
            <button class="cancel-btn" onclick="toggleForm()">취소</button>
        </div>
    </div>
</div>

    <div class="combo-card">
        <h2>🍪 포카칩 + 🥤 피크닉</h2>
        <p>단짠 조합의 정석</p>
    </div>

    <div class="combo-card">
        <h2>🍟 스윙칩 + 🥤 콜라</h2>
        <p>무난한 국룰 조합</p>
    </div>

</main>

<footer>
    <h3>소마고 매슐랭</h3>

    <p>음식 리뷰 및 랭킹 서비스</p>

    <p>제작 : 이홍인 · 김건호</p>

    <p>© 2026 SOMAGO Michelin</p>
</footer>

<script src="foodcombo.js"></script>
</body>
</html>
